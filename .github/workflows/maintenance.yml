name: Repository maintenance
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: 'Verified main commit to consolidate'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: repository-maintenance
  cancel-in-progress: false
jobs:
  consolidate:
    if: github.repository == 'Gabriel6324/automata-explorer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_frontend.cjs
      - name: Consolidate changes after the original Automata history
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          KEEP_PARENT: 5486d923c2fcd5bea3e47b934aeef431892f8269
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$KEEP_PARENT" "$EXPECTED_HEAD"
          test -f app.py
          test -f static/app.js
          test -f templates/student_attempt.html
          test ! -d rag
          test ! -f bootstrap.py
          tree="$(git rev-parse HEAD^{tree})"
          clean_commit="$(printf '%s\n' 'Add exercise management and automata feedback' | git -c user.name=Gabriel6324 -c user.email=159073248+Gabriel6324@users.noreply.github.com commit-tree "$tree" -p "$KEEP_PARENT")"
          test "$(git rev-parse "$clean_commit^{tree}")" = "$tree"
          git push --force-with-lease="refs/heads/main:$EXPECTED_HEAD" origin "$clean_commit:refs/heads/main"
          printf 'Published %s with unchanged source tree %s\n' "$clean_commit" "$tree"
